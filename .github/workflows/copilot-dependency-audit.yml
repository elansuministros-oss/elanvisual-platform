name: Copilot Dependency Audit

on:
  push:
    branches:
      - feat/ELAN-COPILOT-FIELD-UNIFIED-01

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
