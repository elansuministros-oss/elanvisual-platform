name: ELAN Copilot CI

on:
  pull_request:
    paths:
      - 'src/ai/**'
      - 'api/elan-ai.js'
      - 'api/elan-realtime-token.js'
      - 'scripts/elan-copilot-unified-context-check.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/elan-copilot-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm install
      - name: Copilot contract
        run: npm run test:copilot
      - name: Build
        run: npm run build
