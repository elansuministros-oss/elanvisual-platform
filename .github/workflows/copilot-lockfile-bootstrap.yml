name: Copilot Lockfile Bootstrap

on:
  push:
    branches:
      - feat/ELAN-COPILOT-FIELD-UNIFIED-01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ELAN-COPILOT-FIELD-UNIFIED-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package-lock when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "LOCKFILE_ALREADY_SYNCED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(copilot): lock field UI dependencies"
          git push origin HEAD:feat/ELAN-COPILOT-FIELD-UNIFIED-01
