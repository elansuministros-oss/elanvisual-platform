name: Design Portal CI

on:
  push:
    branches:
      - hotfix/DESIGN-PORTAL-SERVER-RESTORE-01
  pull_request:

jobs:
  validate-design-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax
        run: |
          node --check api/elan-ai.js
          node --check api/services/design/designPortalService.js
          node --check api/services/design/designPortalSupabaseAdapter.js
          node --check api/services/design/designProcessingService.js
          node --check api/services/design/designDeliveryState.js
          node --check api/services/design/wahaImageDeliveryService.js

      - name: Tests
        run: npm run test:design

      - name: Build
        run: npm run build
