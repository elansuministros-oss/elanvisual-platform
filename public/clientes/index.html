<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ELANVISUAL · Acceso cliente</title>
</head>
<body>
<script>
(()=>{
  const parts=(location.pathname||'').split('/').filter(Boolean);
  const slug=parts[1]||'';
  if(!slug){location.replace('/');return;}
  location.replace('/cliente/'+encodeURIComponent(decodeURIComponent(slug))+'/');
})();
</script>
</body>
</html>
