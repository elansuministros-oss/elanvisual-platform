<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ELANVISUAL · Acceso cliente</title>
</head>
<body>
<script>
(()=>{
  const CLIENTS_KEY='elan_admin_clients_v1';
  const parts=(location.pathname||'').split('/').filter(Boolean);
  const slug=decodeURIComponent(parts[1]||'').toLowerCase();
  if(!slug){location.replace('/');return;}

  const slugify=v=>String(v||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');

  const tokenFromPortal=value=>{
    const match=String(value||'').match(/^\/c\/([A-Za-z0-9_-]{22})\/?$/);
    return match?.[1]||'';
  };

  const createToken=()=>{
    const bytes=new Uint8Array(16);
    crypto.getRandomValues(bytes);
    let binary='';
    bytes.forEach(byte=>{binary+=String.fromCharCode(byte)});
    return btoa(binary)
      .replace(/\+/g,'-')
      .replace(/\//g,'_')
      .replace(/=+$/,'')
      .slice(0,22);
  };

  let clients=[];
  try{
    const parsed=JSON.parse(localStorage.getItem(CLIENTS_KEY)||'[]');
    if(Array.isArray(parsed))clients=parsed;
  }catch(e){}

  const index=clients.findIndex(client=>
    client?.type==='frequent' &&
    (slugify(client?.name)===slug ||
      String(client?.portal||'').split('/').filter(Boolean).at(-1)===slug)
  );

  if(index<0){
    document.body.innerHTML='<main style="font-family:Arial,sans-serif;max-width:560px;margin:80px auto;padding:24px"><h1>Portal todavía no publicado</h1><p>Este acceso temporal necesita abrirse desde el navegador donde fue creado el cliente.</p></main>';
    return;
  }

  const current=clients[index];
  const token=tokenFromPortal(current.portal)||current.portal_token||createToken();
  const portal='/c/'+token+'/';
  clients[index]={...current,portal,portal_token:token,updated_at:new Date().toISOString()};
  localStorage.setItem(CLIENTS_KEY,JSON.stringify(clients));
  location.replace(portal);
})();
</script>
</body>
</html>
